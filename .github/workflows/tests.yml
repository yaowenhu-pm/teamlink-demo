name: TeamLink checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check browser and shared API source syntax
        run: |
          node --check web/world.mjs
          node --check web/direct-edit.mjs
          node --check server/index.mjs
          node --check web/scene-model.mjs
          node --check web/scene-renderer.mjs
          node --check worker/index.mjs
          node --check worker/rooms.mjs
          node --check worker/interpret.mjs
          node --check scripts/build-landscape.mjs
          node --check web/legacy/app.mjs
          node --check web/legacy/collaboration-ui.mjs
          node --check web/legacy/website.mjs
          node --check web/legacy/legacy-route.js
      - run: npm test
      - name: Build self-hosted browser assets
        run: npm run build
