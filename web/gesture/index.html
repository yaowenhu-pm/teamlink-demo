<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TeamLink 手势实验：张开手、捏合，拨动夕阳或移动帆船。识别文件本机缓存，画面仅在本机处理。">
  <meta name="referrer" content="no-referrer">
  <title>TeamLink · 伸手，拨动夕阳。</title>
  <link rel="icon" href="/assets/teamlink-icon.png">
  <link rel="stylesheet" href="/gesture/gesture.css?v=580c191fdd92">
</head>
<body>
  <main id="gesture-stage" aria-label="本机摄像头手势实验">
    <svg id="landscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-label="可以用手势或鼠标调整太阳的风景"></svg>
    <header class="lab-header">
      <a class="brand" href="/"><img src="/assets/teamlink-symbol.webp" width="34" height="34" alt="">TeamLink <span>手势实验</span></a>
      <div class="canvas-tools" role="toolbar" aria-label="实验控制">
        <a class="github-project-link" href="https://github.com/yaowenhu-pm/teamlink-demo" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 TeamLink 项目（新标签页）" title="GitHub · TeamLink 项目源码"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.043-1.61-4.043-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.605-2.665-.303-5.467-1.333-5.467-5.931 0-1.31.468-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 0 0 1.008-.323 3.301 1.23a11.52 11.52 0 0 1 3.003-.404c1.02.005 2.047.138 3.006.404 2.291-1.553 3.297-1.23 3.297-1.23.655 1.652.243 2.873.12 3.176.77.84 1.235 1.911 1.235 3.221 0 4.61-2.807 5.625-5.479 5.922.43.372.823 1.102.823 2.222 0 1.606-.015 2.901-.015 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.596 24 12.297c0-6.627-5.373-12-12-12"/></svg></a>
        <button id="reset-lab" type="button" title="恢复实验初始风景（R）">恢复夕阳</button>
        <button id="undo-lab" type="button" disabled title="撤销（⌘/Ctrl+Z）">↶ 撤销</button>
        <button id="fullscreen-lab" type="button" title="全屏（F）">↗ 全屏</button>
      </div>
    </header>
    <div class="intro">
      <p class="eyebrow">A small experiment. Just for play.</p>
      <h1>伸手，<br>拨动夕阳。</h1>
      <p>张开手让镜头看见，捏合拇指和食指。<br>拨动夕阳，或让一艘小船跟着你的手走。</p>
    </div>
    <div id="hand-cursor" class="hand-cursor" hidden aria-hidden="true"><span></span></div>
    <aside id="camera-preview" class="camera-preview" hidden aria-label="仅在本机处理的摄像头预览">
      <video id="camera-video" autoplay muted playsinline></video>
      <svg id="hand-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true" hidden></svg>
      <div class="pinch-feedback"><span id="hand-feedback-label">等待手掌</span><progress id="pinch-feedback" max="1" value="0" aria-label="捏合程度"></progress></div>
      <div class="camera-caption"><span class="camera-dot"></span><span>仅本机识别 · 不上传画面</span></div>
    </aside>
    <section class="experiment-panel" aria-label="开启手势实验">
      <div class="panel-status"><span id="state-dot" class="state-dot"></span><p id="gesture-status" role="status" aria-live="polite">先开启摄像头，试着把太阳握在手里。</p><output id="hour-label" aria-label="当前时间">18:18</output></div>
      <div class="target-controls"><div class="target-switch" role="group" aria-label="选择手势控制对象"><button id="target-sun" type="button" aria-pressed="true" title="控制太阳（1）">☀ 太阳</button><button id="target-boat" type="button" aria-pressed="false" title="控制帆船（2）">⛵ 帆船</button></div><span id="asset-cache-state" class="cache-state">首次准备后可复用缓存</span></div>
      <div id="loading-progress" class="loading-progress" hidden>
        <progress id="loading-meter" max="100" value="0" aria-label="识别文件下载进度"></progress>
        <span id="loading-detail">准备下载…</span>
      </div>
      <div class="panel-actions">
        <button id="start-camera" class="primary" type="button">开启摄像头 <span aria-hidden="true">↗</span></button>
        <button id="stop-camera" class="secondary" type="button" hidden>关闭摄像头</button>
        <label class="hour-control"><span>也可拖动风景，或调整时间</span><input id="hour-control" type="range" min="0" max="24" step="0.1" value="18.3" aria-label="手动调整太阳和时间"></label>
      </div>
      <p id="camera-note" class="panel-note">首次可能下载约 10 MB；以后优先读取本机缓存。每次仍需启动识别，准备好后再请求相机权限。</p>
      <p class="panel-footnote">本页是独立本机实验，不改动共享房间。<a href="/">回到共同创作 ↗</a></p>
    </section>
  </main>
  <noscript>请开启 JavaScript 后体验；摄像头只在你主动点击后开启。</noscript>
  <script type="module" src="/gesture/gesture.mjs?v=28ac9cc86159"></script>
</body>
</html>
