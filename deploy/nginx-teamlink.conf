# TeamLink only. System Node and existing virtual hosts are unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name teamlink.yaowenhu.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/teamlink-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://teamlink.yaowenhu.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name teamlink.yaowenhu.cn;
    ssl_certificate /etc/letsencrypt/live/teamlink.yaowenhu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamlink.yaowenhu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TeamLinkTLS:1m;
    server_tokens off;
    client_max_body_size 8k;
    client_body_timeout 15s;
    access_log /var/log/nginx/teamlink-access.log;
    error_log /var/log/nginx/teamlink-error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm application/octet-stream;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/teamlink-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Keep first-load video from consuming the entire 1 Mbps link.
    location ^~ /media/ {
        limit_rate 56k;
        proxy_pass http://127.0.0.1:18086;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 40s;
        # Bounded memory buffers; no temporary media spool on the nearly full disk.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_max_temp_file_size 0;
    }

    location / {
        proxy_pass http://127.0.0.1:18086;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 40s;
        proxy_buffering off;
    }
}
