<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1630" viewBox="0 0 390 1630"><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif}</style><rect width="390" height="1630" fill="#F7F6F2"/><rect x="24" y="22" width="26" height="26" rx="8" fill="#176D67"/><path d="M31 32.0h9m-4 6h9" stroke="white" stroke-width="3" stroke-linecap="round"/><text x="60" y="41.2" font-size="20" font-weight="650" fill="#172D3B">TeamLink</text><rect x="280" y="22" width="86" height="28" rx="14" fill="#EAF3EF" stroke="#EAF3EF"/><text x="292" y="39.32" font-size="12" font-weight="500" fill="#176D67">演示模式</text><path d="M24 72H366" stroke="#E0E5E1"/><text x="24" y="110.32" font-size="12" font-weight="550" fill="#176D67">团队交接 · 互动演示</text><text x="24" y="154.07999999999998" font-size="28" font-weight="650" fill="#172D3B">少重复解释，</text><text x="24" y="195.07999999999998" font-size="28" font-weight="650" fill="#172D3B">把需求一路交到验收</text><text x="24" y="235.18" font-size="13" font-weight="400" fill="#687780">用一份共同确认的任务，完成一次交接。</text><path d="M82.75 286H136.25" stroke="#E0E5E1"/><circle cx="66.75" cy="286" r="11" fill="#176D67"/><text x="63.25" y="288.46" font-size="11" font-weight="600" fill="#FFFFFF">1</text><text x="42.75" y="319.32" font-size="12" font-weight="600" fill="#176D67">需求确认</text><path d="M168.25 286H221.75" stroke="#E0E5E1"/><circle cx="152.25" cy="286" r="11" fill="#F2F4F1"/><text x="148.75" y="288.46" font-size="11" font-weight="600" fill="#687780">2</text><text x="128.25" y="319.32" font-size="12" font-weight="400" fill="#687780">研发接单</text><path d="M253.75 286H307.25" stroke="#E0E5E1"/><circle cx="237.75" cy="286" r="11" fill="#F2F4F1"/><text x="234.25" y="288.46" font-size="11" font-weight="600" fill="#687780">3</text><text x="213.75" y="319.32" font-size="12" font-weight="400" fill="#687780">交付</text><circle cx="323.25" cy="286" r="11" fill="#F2F4F1"/><text x="319.75" y="288.46" font-size="11" font-weight="600" fill="#687780">4</text><text x="299.25" y="319.32" font-size="12" font-weight="400" fill="#687780">验收</text><rect x="24" y="352" width="342" height="42" rx="10" fill="#FFFFFF" stroke="#E0E5E1"/><rect x="28" y="356" width="167" height="34" rx="7" fill="#EAF3EF" stroke="#EAF3EF"/><text x="76" y="377.04" font-size="14" font-weight="600" fill="#176D67">产品经理</text><text x="241" y="377.04" font-size="14" font-weight="400" fill="#687780">研发同学</text><rect x="24" y="414" width="342" height="506" rx="16" fill="#FFFFFF" stroke="#E0E5E1"/><text x="44" y="454.34" font-size="19" font-weight="600" fill="#172D3B">把背景说一遍就够了</text><text x="44" y="483.18" font-size="13" font-weight="400" fill="#687780">只共享你确认的内容。</text><path d="M44 505H346" stroke="#E0E5E1"/><rect x="44" y="524" width="122" height="28" rx="14" fill="#EAF3EF" stroke="#EAF3EF"/><text x="56" y="541.32" font-size="12" font-weight="500" fill="#176D67">你 · 产品经理</text><text x="278" y="541.46" font-size="11" font-weight="400" fill="#687780">可编辑</text><rect x="44" y="568" width="302" height="135" rx="11" fill="#F2F4F1" stroke="#E0E5E1"/><text x="60" y="596.04" font-size="14" font-weight="400" fill="#172D3B">想给活动报名加一个候补名单。</text><text x="60" y="622.04" font-size="14" font-weight="400" fill="#172D3B">名额满了先排队，有人取消后</text><text x="60" y="648.04" font-size="14" font-weight="400" fill="#172D3B">按顺序递补，也让用户知道</text><text x="60" y="674.04" font-size="14" font-weight="400" fill="#172D3B">自己排到了第几位。</text><rect x="44" y="721" width="86" height="28" rx="14" fill="#EAF3EF" stroke="#EAF3EF"/><text x="56" y="738.32" font-size="12" font-weight="500" fill="#176D67">活动报名</text><rect x="140" y="721" width="86" height="28" rx="14" fill="#F2F4F1" stroke="#F2F4F1"/><text x="152" y="738.32" font-size="12" font-weight="500" fill="#687780">用户反馈</text><rect x="236" y="721" width="86" height="28" rx="14" fill="#F2F4F1" stroke="#F2F4F1"/><text x="248" y="738.32" font-size="12" font-weight="500" fill="#687780">成员邀请</text><text x="44" y="788.18" font-size="13" font-weight="400" fill="#687780">TeamLink 已整理好范围与验收标准。</text><text x="44" y="812.18" font-size="13" font-weight="400" fill="#687780">下一位接到的，就是你确认的这一版。</text><rect x="44" y="843" width="302" height="48" rx="10" fill="#176D67" stroke="#176D67"/><text x="135.8" y="870.9" font-size="15" font-weight="600" fill="#FFFFFF">确认并交接  →</text><rect x="24" y="940" width="342" height="594" rx="16" fill="#FFFFFF" stroke="#E0E5E1"/><text x="44" y="980.34" font-size="19" font-weight="600" fill="#172D3B">同一份共享任务</text><rect x="257" y="960" width="87" height="28" rx="14" fill="#EAF3EF" stroke="#EAF3EF"/><text x="269" y="977.32" font-size="12" font-weight="500" fill="#176D67">待你确认</text><text x="44" y="1027.2" font-size="20" font-weight="600" fill="#172D3B">活动报名：候补名单</text><text x="44" y="1058.18" font-size="13" font-weight="400" fill="#687780">草稿 · 尚未确认</text><text x="44" y="1092.18" font-size="13" font-weight="400" fill="#172D3B">负责人   小林 · 研发（虚构）</text><path d="M44 1116H346" stroke="#E0E5E1"/><text x="44" y="1145.32" font-size="12" font-weight="550" fill="#687780">本次范围</text><text x="44" y="1175.04" font-size="14" font-weight="400" fill="#172D3B">满员候补、顺序递补、显示排队位置。</text><text x="44" y="1218.32" font-size="12" font-weight="550" fill="#687780">验收标准</text><text x="44" y="1247.18" font-size="13" font-weight="400" fill="#172D3B">□  满员报名进入候补，不占正式名额。</text><text x="44" y="1275.18" font-size="13" font-weight="400" fill="#172D3B">□  取消后首位候补递补，并收到提示。</text><path d="M44 1311H346" stroke="#E0E5E1"/><text x="52" y="1344.04" font-size="14" font-weight="600" fill="#176D67">飞书预览</text><text x="162" y="1344.04" font-size="14" font-weight="400" fill="#687780">GitHub 预览</text><path d="M44 1362H130" stroke="#176D67" stroke-width="2"/><text x="44" y="1388.46" font-size="11" font-weight="400" fill="#687780">模拟视图 · 不会写入真实账号</text><rect x="44" y="1410" width="302" height="99" rx="10" fill="#EAF3EF" stroke="#EAF3EF"/><text x="60" y="1438.18" font-size="13" font-weight="600" fill="#176D67">TeamLink 共享记录</text><text x="60" y="1466.18" font-size="13" font-weight="400" fill="#172D3B">确认后同步需求版本、负责人</text><text x="60" y="1489.18" font-size="13" font-weight="400" fill="#172D3B">和验收标准。</text><text x="24" y="1567.46" font-size="11" font-weight="400" fill="#687780">人物与记录均为虚构，不会发送真实消息。</text><text x="24" y="1596.32" font-size="12" font-weight="550" fill="#176D67">重置演示</text></svg>