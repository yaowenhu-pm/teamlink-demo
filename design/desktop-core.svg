<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif}</style><rect width="1440" height="1080" fill="#F7F6F2"/><rect width="1440" height="76" fill="#F7F6F2"/><rect x="80" y="23" width="30" height="30" rx="8" fill="#176D67"/><path d="M87 35.0h9m-4 6h9" stroke="white" stroke-width="3" stroke-linecap="round"/><text x="120" y="44.78" font-size="23" font-weight="650" fill="#172D3B">TeamLink</text><rect x="1112" y="24" width="86" height="28" rx="14" fill="#EAF3EF" stroke="#EAF3EF"/><text x="1124" y="41.32" font-size="12" font-weight="500" fill="#176D67">演示模式</text><text x="1226" y="43.04" font-size="14" font-weight="500" fill="#687780">查看 GitHub ↗</text><path d="M80 76H1360" stroke="#E0E5E1"/><text x="80" y="127.18" font-size="13" font-weight="550" fill="#176D67">把一段需求，变成双方认可的一次交接</text><text x="80" y="185.54" font-size="39" font-weight="650" fill="#172D3B">少重复解释，把需求一路交到验收</text><text x="80" y="224.76" font-size="16" font-weight="400" fill="#687780">亲手走一遍：确认需求、研发接单、提交证据，再按同一标准验收。</text><rect x="80" y="263" width="1280" height="80" rx="16" fill="#FFFFFF" stroke="#E0E5E1"/><path d="M134.0 303H422.0" stroke="#E0E5E1"/><circle cx="118.0" cy="303" r="15" fill="#176D67"/><text x="114.5" y="306.18" font-size="13" font-weight="600" fill="#FFFFFF">1</text><text x="143.0" y="307.9" font-size="15" font-weight="600" fill="#176D67">需求确认</text><path d="M454.0 303H742.0" stroke="#E0E5E1"/><circle cx="438.0" cy="303" r="15" fill="#F2F4F1"/><text x="434.5" y="306.18" font-size="13" font-weight="600" fill="#687780">2</text><text x="463.0" y="307.9" font-size="15" font-weight="400" fill="#687780">研发接单</text><path d="M774.0 303H1062.0" stroke="#E0E5E1"/><circle cx="758.0" cy="303" r="15" fill="#F2F4F1"/><text x="754.5" y="306.18" font-size="13" font-weight="600" fill="#687780">3</text><text x="783.0" y="307.9" font-size="15" font-weight="400" fill="#687780">交付</text><circle cx="1078.0" cy="303" r="15" fill="#F2F4F1"/><text x="1074.5" y="306.18" font-size="13" font-weight="600" fill="#687780">4</text><text x="1103.0" y="307.9" font-size="15" font-weight="400" fill="#687780">验收</text><text x="80" y="389.76" font-size="16" font-weight="600" fill="#172D3B">01  先把这次要做的事说清楚</text><text x="1068" y="390.18" font-size="13" font-weight="400" fill="#687780">你现在是</text><rect x="1146" y="363" width="214" height="38" rx="10" fill="#FFFFFF" stroke="#E0E5E1"/><rect x="1150" y="367" width="100" height="30" rx="7" fill="#EAF3EF" stroke="#EAF3EF"/><text x="1172" y="386.18" font-size="13" font-weight="600" fill="#176D67">产品经理</text><text x="1275" y="386.18" font-size="13" font-weight="400" fill="#687780">研发同学</text><rect x="80" y="424" width="592" height="556" rx="16" fill="#FFFFFF" stroke="#E0E5E1"/><text x="108" y="469.2" font-size="20" font-weight="600" fill="#172D3B">把背景说一遍就够了</text><text x="108" y="498.04" font-size="14" font-weight="400" fill="#687780">只把你确认的内容交给下一位。</text><path d="M108 522H644" stroke="#E0E5E1"/><rect x="108" y="542" width="122" height="28" rx="14" fill="#EAF3EF" stroke="#EAF3EF"/><text x="120" y="559.32" font-size="12" font-weight="500" fill="#176D67">你 · 产品经理</text><text x="548" y="560.32" font-size="12" font-weight="400" fill="#687780">可编辑预设</text><rect x="108" y="586" width="536" height="132" rx="12" fill="#F2F4F1" stroke="#E0E5E1"/><text x="128" y="618.76" font-size="16" font-weight="400" fill="#172D3B">想给活动报名加一个候补名单。</text><text x="128" y="647.76" font-size="16" font-weight="400" fill="#172D3B">名额满了先排队，有人取消后按顺序递补，</text><text x="128" y="676.76" font-size="16" font-weight="400" fill="#172D3B">也让用户知道自己排到了第几位。</text><text x="108" y="749.32" font-size="12" font-weight="400" fill="#687780">换个场景</text><rect x="177" y="730" width="86" height="28" rx="14" fill="#EAF3EF" stroke="#EAF3EF"/><text x="189" y="747.32" font-size="12" font-weight="500" fill="#176D67">活动报名</text><rect x="272" y="730" width="86" height="28" rx="14" fill="#F2F4F1" stroke="#F2F4F1"/><text x="284" y="747.32" font-size="12" font-weight="500" fill="#687780">用户反馈</text><rect x="367" y="730" width="86" height="28" rx="14" fill="#F2F4F1" stroke="#F2F4F1"/><text x="379" y="747.32" font-size="12" font-weight="500" fill="#687780">成员邀请</text><text x="108" y="803.18" font-size="13" font-weight="600" fill="#176D67">TeamLink</text><text x="108" y="830.04" font-size="14" font-weight="400" fill="#687780">已整理出范围与验收标准。</text><text x="108" y="855.04" font-size="14" font-weight="400" fill="#687780">确认后，研发接到的是这一版，而不是另一段转述。</text><rect x="108" y="895" width="536" height="48" rx="10" fill="#176D67" stroke="#176D67"/><text x="316.8" y="922.9" font-size="15" font-weight="600" fill="#FFFFFF">确认并交接  →</text><text x="225" y="965.32" font-size="12" font-weight="400" fill="#687780">演示数据 · 不会向真实团队发送消息</text><rect x="696" y="424" width="664" height="556" rx="16" fill="#FFFFFF" stroke="#E0E5E1"/><text x="724" y="469.2" font-size="20" font-weight="600" fill="#172D3B">双方看到同一份任务</text><rect x="1245" y="448" width="87" height="28" rx="14" fill="#EAF3EF" stroke="#EAF3EF"/><text x="1257" y="465.32" font-size="12" font-weight="500" fill="#176D67">待你确认</text><text x="724" y="521.78" font-size="23" font-weight="600" fill="#172D3B">活动报名：候补名单</text><text x="724" y="550.32" font-size="12" font-weight="400" fill="#687780">需求版本</text><text x="724" y="574.04" font-size="14" font-weight="500" fill="#172D3B">草稿 · 尚未确认</text><text x="1028" y="550.32" font-size="12" font-weight="400" fill="#687780">负责人</text><text x="1028" y="574.04" font-size="14" font-weight="500" fill="#172D3B">小林 · 研发（虚构）</text><path d="M724 600H1332" stroke="#E0E5E1"/><text x="724" y="631.18" font-size="13" font-weight="550" fill="#687780">本次范围</text><text x="724" y="662.9" font-size="15" font-weight="400" fill="#172D3B">名额满时进入候补；取消后顺序递补；显示排队位置。</text><text x="724" y="706.18" font-size="13" font-weight="550" fill="#687780">验收标准</text><text x="724" y="738.04" font-size="14" font-weight="400" fill="#172D3B">□  满员后报名进入候补，不占用正式名额。</text><text x="724" y="767.04" font-size="14" font-weight="400" fill="#172D3B">□  有人取消后，首位候补自动递补并收到提示。</text><path d="M724 798H1332" stroke="#E0E5E1"/><text x="734" y="831.04" font-size="14" font-weight="600" fill="#176D67">飞书预览</text><text x="840" y="831.04" font-size="14" font-weight="400" fill="#687780">GitHub 预览</text><path d="M724 848H812" stroke="#176D67" stroke-width="2"/><text x="1020" y="832.32" font-size="12" font-weight="400" fill="#687780">模拟视图 · 不会写入真实账号</text><rect x="724" y="865" width="608" height="87" rx="10" fill="#EAF3EF" stroke="#EAF3EF"/><text x="744" y="892.18" font-size="13" font-weight="600" fill="#176D67">TeamLink 共享记录</text><text x="744" y="919.18" font-size="13" font-weight="400" fill="#172D3B">确认后同步需求版本、负责人和验收标准。</text><text x="80" y="1024.32" font-size="12" font-weight="400" fill="#687780">所有人物、任务与工程记录均为虚构。你可以安全试错，再重新开始。</text><text x="1285" y="1024.32" font-size="12" font-weight="550" fill="#176D67">重置演示</text></svg>