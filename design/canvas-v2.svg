<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif}</style><rect width="1440" height="1000" fill="#F7F6F2"/><rect x="44" y="20" width="26" height="26" rx="7" fill="#176D67" stroke="#176D67"/><path d="M50 30h9m-4 6h9" stroke="white" stroke-width="2.5" stroke-linecap="round"/><text x="80" y="38.2" font-size="20" font-weight="650" fill="#172D3B">TeamLink</text><text x="205" y="39.04" font-size="14" font-weight="500" fill="#687780">共创画布</text><text x="975" y="40.18" font-size="13" font-weight="400" fill="#687780">↶  撤销</text><text x="1055" y="40.18" font-size="13" font-weight="400" fill="#AAB3B5">↷  重做</text><rect x="1140" y="15" width="124" height="38" rx="8" fill="#FFFFFF" stroke="#E0E5E1"/><text x="1156" y="38.18" font-size="13" font-weight="550" fill="#172D3B">保留对照  ✓</text><rect x="1280" y="15" width="116" height="38" rx="8" fill="#FFFFFF" stroke="#E0E5E1"/><text x="1296" y="38.18" font-size="13" font-weight="550" fill="#172D3B">分享  ↗</text><path d="M44 70h1352" stroke="#E0E5E1"/><text x="44" y="121.5" font-size="25" font-weight="650" fill="#172D3B">直接改作品，整个过程马上改变。</text><text x="44" y="152.04" font-size="14" font-weight="400" fill="#687780">改文案、筛选条件或行为规则；下面会同时展示请求、错误、重试与文件的变化。</text><rect x="44" y="184" width="850" height="353" rx="16" fill="#FFFFFF" stroke="#E0E5E1"/><text x="76" y="216.32" font-size="12" font-weight="400" fill="#687780">你正在共同打磨的作品</text><text x="733" y="217.32" font-size="12" font-weight="400" fill="#687780">文字可直接编辑</text><text x="76" y="263.08" font-size="28" font-weight="650" fill="#172D3B">导出项目记录</text><path d="M76 274h169" stroke="#176D67"/><text x="76" y="300.9" font-size="15" font-weight="400" fill="#172D3B">按月份与分类筛选，导出你眼前的数据。</text><text x="76" y="341.32" font-size="12" font-weight="400" fill="#687780">月份</text><rect x="76" y="354" width="252" height="42" rx="8" fill="#FFFFFF" stroke="#E0E5E1"/><text x="88" y="379.04" font-size="14" font-weight="500" fill="#172D3B">2026 年 10 月</text><text x="302" y="379.04" font-size="14" font-weight="400" fill="#687780">⌄</text><text x="344" y="341.32" font-size="12" font-weight="400" fill="#687780">分类</text><rect x="344" y="354" width="228" height="42" rx="8" fill="#FFFFFF" stroke="#E0E5E1"/><text x="356" y="379.04" font-size="14" font-weight="500" fill="#172D3B">产品</text><text x="546" y="379.04" font-size="14" font-weight="400" fill="#687780">⌄</text><rect x="666" y="354" width="196" height="38" rx="8" fill="#176D67" stroke="#176D67"/><text x="682" y="377.18" font-size="13" font-weight="550" fill="#FFFFFF">导出 2 条记录  →</text><rect x="76" y="422" width="786" height="82" rx="10" fill="#FBF4E8" stroke="#FBF4E8"/><text x="94" y="451.9" font-size="15" font-weight="500" fill="#172D3B">这次导出超时，筛选条件已保留。</text><text x="94" y="479.18" font-size="13" font-weight="400" fill="#687780">再试一次就好，无需重新填写。</text><rect x="732" y="441" width="112" height="38" rx="8" fill="#176D67" stroke="#176D67"/><text x="748" y="464.18" font-size="13" font-weight="550" fill="#FFFFFF">再试一次</text><rect x="918" y="184" width="478" height="353" rx="16" fill="#FFFFFF" stroke="#E0E5E1"/><text x="942" y="222.48" font-size="18" font-weight="600" fill="#172D3B">这件作品怎样工作</text><text x="942" y="254.04" font-size="14" font-weight="400" fill="#172D3B">失败后，保留用户已经选好的条件</text><rect x="1328" y="240" width="40" height="22" rx="11" fill="#176D67" stroke="#176D67"/><circle cx="1357" cy="251" r="8" fill="white"/><path d="M942 282h430" stroke="#E0E5E1"/><text x="942" y="314.18" font-size="13" font-weight="400" fill="#687780">重试时使用</text><rect x="1050" y="294" width="182" height="36" rx="8" fill="#EAF3EF" stroke="#EAF3EF"/><text x="1064" y="317.04" font-size="14" font-weight="550" fill="#176D67">眼前的筛选条件</text><text x="1251" y="317.04" font-size="14" font-weight="400" fill="#687780">首次条件</text><path d="M942 352h430" stroke="#E0E5E1"/><text x="942" y="386.04" font-size="14" font-weight="400" fill="#172D3B">等待</text><text x="994" y="387.5" font-size="25" font-weight="650" fill="#176D67">2.0</text><path d="M992 399h54" stroke="#176D67"/><text x="1060" y="386.04" font-size="14" font-weight="400" fill="#172D3B">秒后超时</text><text x="1198" y="385.32" font-size="12" font-weight="400" fill="#687780">↔  左右拖动数值</text><text x="942" y="442.18" font-size="13" font-weight="400" fill="#687780">所有结果都从当前规则与下方数据演算。</text><text x="942" y="475.32" font-size="12" font-weight="400" fill="#687780">演算假设：首次请求超时，重试成功。</text><text x="942" y="496.32" font-size="12" font-weight="400" fill="#687780">示例没有连接真实导出服务。</text><text x="44" y="586.34" font-size="19" font-weight="600" fill="#172D3B">从你选择的数据，到最后拿到的文件</text><text x="1138" y="584.32" font-size="12" font-weight="550" fill="#176D67">━━  当前作品</text><text x="1260" y="584.32" font-size="12" font-weight="400" fill="#687780">┄┄  保留的对照</text><rect x="44" y="609" width="326" height="157" rx="12" fill="#FFFFFF" stroke="#E0E5E1"/><text x="62" y="636.32" font-size="12" font-weight="550" fill="#687780">01  首次请求</text><text x="62" y="670.34" font-size="19" font-weight="600" fill="#172D3B">10 月 / 产品</text><text x="62" y="696.18" font-size="13" font-weight="500" fill="#176D67">请求 2 条记录</text><path d="M62 717h290" stroke="#E0E5E1" stroke-dasharray="4 4"/><text x="62" y="745.32" font-size="12" font-weight="400" fill="#687780">10 月 / 产品 · 同样 2 条</text><rect x="386" y="609" width="326" height="157" rx="12" fill="#FFFFFF" stroke="#E0E5E1"/><text x="404" y="636.32" font-size="12" font-weight="550" fill="#687780">02  发生超时</text><text x="404" y="670.34" font-size="19" font-weight="600" fill="#172D3B">2.0 秒后超时</text><text x="404" y="696.18" font-size="13" font-weight="500" fill="#176D67">筛选仍是：10 月 / 产品</text><path d="M404 717h290" stroke="#E0E5E1" stroke-dasharray="4 4"/><text x="404" y="745.32" font-size="12" font-weight="400" fill="#687780">5.0 秒超时 · 筛选被清空</text><rect x="728" y="609" width="326" height="157" rx="12" fill="#FFFFFF" stroke="#E0E5E1"/><text x="746" y="636.32" font-size="12" font-weight="550" fill="#687780">03  再次请求</text><text x="746" y="670.34" font-size="19" font-weight="600" fill="#172D3B">使用眼前条件</text><text x="746" y="696.18" font-size="13" font-weight="500" fill="#176D67">10 月 / 产品 → 2 条</text><path d="M746 717h290" stroke="#E0E5E1" stroke-dasharray="4 4"/><text x="746" y="745.32" font-size="12" font-weight="400" fill="#687780">全部 / 全部 → 4 条</text><rect x="1070" y="609" width="326" height="157" rx="12" fill="#FFFFFF" stroke="#E0E5E1"/><text x="1088" y="636.32" font-size="12" font-weight="550" fill="#687780">04  收到文件</text><text x="1088" y="670.34" font-size="19" font-weight="600" fill="#172D3B">10月-产品.csv</text><text x="1088" y="696.18" font-size="13" font-weight="500" fill="#176D67">2 条 · 与筛选一致</text><path d="M1088 717h290" stroke="#E0E5E1" stroke-dasharray="4 4"/><text x="1088" y="745.32" font-size="12" font-weight="400" fill="#687780">4 条 · 多出 2 条无关记录</text><text x="44" y="811.48" font-size="18" font-weight="600" fill="#172D3B">作品使用的数据</text><text x="218" y="811.18" font-size="13" font-weight="400" fill="#687780">直接改单元格，筛选结果与导出文件一起更新。</text><text x="1226" y="810.32" font-size="12" font-weight="550" fill="#176D67">当前命中 2 / 4 条</text><rect x="44" y="833" width="1352" height="137" rx="10" fill="#FFFFFF" stroke="#E0E5E1"/><rect x="45" y="834" width="1350" height="29" rx="9" fill="#F2F4F1" stroke="#F2F4F1"/><text x="64" y="852.32" font-size="12" font-weight="550" fill="#687780">日期</text><text x="258" y="852.32" font-size="12" font-weight="550" fill="#687780">分类</text><text x="456" y="852.32" font-size="12" font-weight="550" fill="#687780">记录内容</text><text x="1240" y="852.32" font-size="12" font-weight="550" fill="#687780">当前筛选</text><text x="64" y="880.32" font-size="12" font-weight="400" fill="#172D3B">2026-10-03</text><text x="258" y="880.32" font-size="12" font-weight="400" fill="#172D3B">产品</text><text x="456" y="880.32" font-size="12" font-weight="400" fill="#172D3B">用户需求回访</text><text x="1240" y="880.32" font-size="12" font-weight="400" fill="#176D67">包含</text><path d="M64 889h1310" stroke="#E0E5E1"/><text x="64" y="904.32" font-size="12" font-weight="400" fill="#172D3B">2026-10-18</text><text x="258" y="904.32" font-size="12" font-weight="400" fill="#172D3B">产品</text><text x="456" y="904.32" font-size="12" font-weight="400" fill="#172D3B">报名体验修正</text><text x="1240" y="904.32" font-size="12" font-weight="400" fill="#176D67">包含</text><path d="M64 913h1310" stroke="#E0E5E1"/><text x="64" y="928.32" font-size="12" font-weight="400" fill="#172D3B">2026-10-24</text><text x="258" y="928.32" font-size="12" font-weight="400" fill="#172D3B">研发</text><text x="456" y="928.32" font-size="12" font-weight="400" fill="#172D3B">导出接口联调</text><text x="1240" y="928.32" font-size="12" font-weight="400" fill="#172D3B">未包含</text><path d="M64 937h1310" stroke="#E0E5E1"/><text x="64" y="952.32" font-size="12" font-weight="400" fill="#172D3B">2026-09-25</text><text x="258" y="952.32" font-size="12" font-weight="400" fill="#172D3B">产品</text><text x="456" y="952.32" font-size="12" font-weight="400" fill="#172D3B">历史项目记录</text><text x="1240" y="952.32" font-size="12" font-weight="400" fill="#172D3B">未包含</text><text x="44" y="993.6" font-size="10" font-weight="400" fill="#687780">虚构数据 · 改动仅留在本次浏览器。对照是一份快照，不会跟着当前修改。</text></svg>