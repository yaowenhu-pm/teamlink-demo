<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2800" viewBox="0 0 1440 2800"><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif}</style><rect width="1440" height="2800" fill="#F7F6F2"/><rect x="88" y="29" width="30" height="30" rx="8" fill="#176D67" stroke="#176D67"/><path d="M95 40h9m-4 7h9" stroke="white" stroke-width="2.7" stroke-linecap="round"/><text x="130" y="50.78" font-size="23" font-weight="650" fill="#172D3B">TeamLink</text><text x="815" y="50.04" font-size="14" font-weight="400" fill="#687780">体验作品</text><text x="925" y="50.04" font-size="14" font-weight="400" fill="#687780">工作方式</text><text x="1035" y="50.04" font-size="14" font-weight="400" fill="#687780">开源</text><rect x="1153" y="19" width="199" height="52" rx="8" fill="#F7F6F2" stroke="#DDE3DE"/><text x="1174" y="49.9" font-size="15" font-weight="550" fill="#172D3B">打开共创画布  ↗</text><path d="M88 94h1264" stroke="#DDE3DE" stroke-width="1"/><text x="88" y="166.04" font-size="14" font-weight="550" fill="#176D67">产品共创，从一件能修改的作品开始</text><text x="88" y="256.76" font-size="66" font-weight="650" fill="#172D3B">一起改作品，</text><text x="88" y="338.76" font-size="66" font-weight="650" fill="#172D3B">把想法变清楚。</text><text x="922" y="231.5" font-size="25" font-weight="550" fill="#172D3B">你说的“保留输入”，</text><text x="922" y="269.5" font-size="25" font-weight="550" fill="#172D3B">和我理解的一样吗？</text><text x="922" y="325.76" font-size="16" font-weight="400" fill="#687780">直接改文案、数据和规则，马上看见结果。</text><text x="922" y="354.76" font-size="16" font-weight="400" fill="#687780">保留这一版、比较修改，再把具体问题</text><text x="922" y="383.76" font-size="16" font-weight="400" fill="#687780">交给自己的 Codex 继续做。</text><rect x="88" y="403" width="231" height="52" rx="8" fill="#176D67" stroke="#176D67"/><text x="109" y="433.9" font-size="15" font-weight="550" fill="#FFFFFF">直接体验，无需登录  →</text><text x="353" y="435.9" font-size="15" font-weight="550" fill="#176D67">看源码  ↗</text><text x="88" y="500.9" font-size="15" font-weight="400" fill="#687780">不用把所有意思一次说完。先改一下，看看会发生什么。</text><text x="1194" y="502.18" font-size="13" font-weight="400" fill="#687780">向下动手试  ↓</text><rect x="88" y="542" width="1264" height="540" rx="16" fill="#FFFFFF" stroke="#DDE3DE"/><text x="120" y="590.92" font-size="22" font-weight="600" fill="#172D3B">先试一下：失败之后，筛选条件还在吗？</text><text x="120" y="623.04" font-size="14" font-weight="400" fill="#687780">这个小作品可以直接改。所有结果在浏览器内计算，没有真实网络请求。</text><path d="M120 646h1200" stroke="#DDE3DE" stroke-width="1"/><rect x="120" y="672" width="735" height="264" rx="11" fill="#F7F6F2" stroke="#DDE3DE"/><text x="145" y="717.5" font-size="25" font-weight="600" fill="#172D3B">导出项目记录</text><path d="M145 728h152" stroke="#176D67" stroke-width="1"/><text x="145" y="759.04" font-size="14" font-weight="400" fill="#172D3B">选好月份和分类，导出你眼前的数据。</text><text x="145" y="799.32" font-size="12" font-weight="400" fill="#687780">月份</text><rect x="145" y="812" width="213" height="41" rx="7" fill="#FFFFFF" stroke="#DDE3DE"/><text x="157" y="837.04" font-size="14" font-weight="400" fill="#172D3B">2026 年 10 月</text><text x="335" y="836.18" font-size="13" font-weight="400" fill="#687780">⌄</text><text x="376" y="799.32" font-size="12" font-weight="400" fill="#687780">分类</text><rect x="376" y="812" width="194" height="41" rx="7" fill="#FFFFFF" stroke="#DDE3DE"/><text x="388" y="837.04" font-size="14" font-weight="400" fill="#172D3B">产品</text><text x="547" y="836.18" font-size="13" font-weight="400" fill="#687780">⌄</text><rect x="589" y="812" width="241" height="41" rx="7" fill="#176D67" stroke="#176D67"/><text x="610" y="837.04" font-size="14" font-weight="550" fill="#FFFFFF">导出记录  →</text><text x="145" y="895.18" font-size="13" font-weight="500" fill="#91662A">最初选中 3 条；当前规则会额外导出 7 条。</text><text x="897" y="696.76" font-size="16" font-weight="550" fill="#172D3B">超时后保留筛选条件</text><rect x="1276" y="678" width="45" height="25" rx="13" fill="#DDE3DE" stroke="#DDE3DE"/><circle cx="1289" cy="690.5" r="9" fill="white"/><text x="897" y="737.18" font-size="13" font-weight="400" fill="#687780">试着打开开关，观察下面三组数字。</text><path d="M897 765h424" stroke="#DDE3DE" stroke-width="1"/><text x="897" y="801.32" font-size="12" font-weight="400" fill="#687780">最初选择</text><text x="1056" y="801.32" font-size="12" font-weight="400" fill="#687780">重试请求</text><text x="1213" y="801.32" font-size="12" font-weight="400" fill="#687780">最终文件</text><text x="907" y="862.98" font-size="43" font-weight="600" fill="#172D3B">3</text><text x="1000" y="857.92" font-size="22" font-weight="400" fill="#687780">→</text><text x="1058" y="862.98" font-size="43" font-weight="600" fill="#91662A">10</text><text x="1153" y="857.92" font-size="22" font-weight="400" fill="#687780">→</text><text x="1214" y="862.98" font-size="43" font-weight="600" fill="#91662A">10</text><text x="897" y="910.32" font-size="12" font-weight="400" fill="#687780">重试使用眼前条件 · 等待预算 800 毫秒</text><path d="M120 967h1200" stroke="#DDE3DE" stroke-width="1"/><text x="120" y="1003.76" font-size="16" font-weight="450" fill="#172D3B">一个开关会改变界面、请求和文件，</text><text x="120" y="1030.76" font-size="16" font-weight="450" fill="#172D3B">这些变化来自同一套规则。</text><rect x="1090" y="987" width="230" height="52" rx="8" fill="#176D67" stroke="#176D67"/><text x="1111" y="1017.9" font-size="15" font-weight="550" fill="#FFFFFF">打开完整画布  ↗</text><text x="88" y="1125.18" font-size="13" font-weight="400" fill="#687780">可编辑样例，不是自动生成任意应用。你在完整画布里还能改数据、回看过程、保留对照。</text><rect x="0" y="1190" width="1440" height="643" fill="#172D3B"/><text x="88" y="1283.54" font-size="39" font-weight="600" fill="#F7F6F2">让改动成为</text><text x="88" y="1339.54" font-size="39" font-weight="600" fill="#F7F6F2">一次接得住的讨论。</text><text x="88" y="1432.62" font-size="17" font-weight="400" fill="#D4E1DD">想法、证据与具体版本放在一起，</text><text x="88" y="1463.62" font-size="17" font-weight="400" fill="#D4E1DD">下一位就能从这里继续。</text><text x="88" y="1739.04" font-size="14" font-weight="450" fill="#9BC5B8">每次修改，都能继续回到作品。</text><text x="690" y="1270.9" font-size="15" font-weight="550" fill="#9BC5B8">01</text><text x="750" y="1274.92" font-size="22" font-weight="550" fill="#F7F6F2">动手改</text><text x="750" y="1308.04" font-size="14" font-weight="400" fill="#D4E1DD">文案直接改，规则直接试。</text><text x="750" y="1332.04" font-size="14" font-weight="400" fill="#D4E1DD">马上看到这次修改带来的结果。</text><path d="M690 1366h662" stroke="#37515D" stroke-width="1"/><text x="690" y="1402.9" font-size="15" font-weight="550" fill="#9BC5B8">02</text><text x="750" y="1406.92" font-size="22" font-weight="550" fill="#F7F6F2">留下方案</text><text x="750" y="1440.04" font-size="14" font-weight="400" fill="#D4E1DD">给值得保留的想法起个名字。</text><text x="750" y="1464.04" font-size="14" font-weight="400" fill="#D4E1DD">原版不变，继续比较和尝试。</text><path d="M690 1498h662" stroke="#37515D" stroke-width="1"/><text x="690" y="1534.9" font-size="15" font-weight="550" fill="#9BC5B8">03</text><text x="750" y="1538.92" font-size="22" font-weight="550" fill="#F7F6F2">交给自己的 Codex</text><text x="750" y="1572.04" font-size="14" font-weight="400" fill="#D4E1DD">导出具体版本和问题，在自己的环境中处理。</text><text x="750" y="1596.04" font-size="14" font-weight="400" fill="#D4E1DD">网页不会替你启动或冒充 Agent。</text><path d="M690 1630h662" stroke="#37515D" stroke-width="1"/><text x="690" y="1666.9" font-size="15" font-weight="550" fill="#9BC5B8">04</text><text x="750" y="1670.92" font-size="22" font-weight="550" fill="#F7F6F2">看过差异，再采纳</text><text x="750" y="1704.04" font-size="14" font-weight="400" fill="#D4E1DD">带回候选方案，先核对修改与实际效果。</text><text x="750" y="1728.04" font-size="14" font-weight="400" fill="#D4E1DD">作品已经变化时，先解决版本冲突。</text><text x="88" y="1935.54" font-size="39" font-weight="600" fill="#172D3B">让原来的工具，</text><text x="88" y="1989.54" font-size="39" font-weight="600" fill="#172D3B">各做擅长的事。</text><text x="795" y="1930.62" font-size="17" font-weight="400" fill="#687780">TeamLink 把具体作品与修改上下文交接清楚。</text><text x="795" y="1960.62" font-size="17" font-weight="400" fill="#687780">你仍在熟悉的环境里讨论、开发和审查。</text><path d="M88 2048h1264" stroke="#DDE3DE" stroke-width="1"/><text x="88" y="2086.5" font-size="25" font-weight="600" fill="#172D3B">Codex</text><text x="354" y="2083.76" font-size="16" font-weight="400" fill="#172D3B">在自己的环境里理解问题、实现修改。</text><text x="910" y="2083.18" font-size="13" font-weight="400" fill="#687780">当前：手动导出任务包，导入返回方案。</text><path d="M88 2155h1264" stroke="#DDE3DE" stroke-width="1"/><text x="88" y="2193.5" font-size="25" font-weight="600" fill="#172D3B">飞书</text><text x="354" y="2190.76" font-size="16" font-weight="400" fill="#172D3B">承载团队明确共享的背景与正式讨论。</text><text x="910" y="2190.18" font-size="13" font-weight="400" fill="#687780">当前公开体验未连接真实飞书账号。</text><path d="M88 2262h1264" stroke="#DDE3DE" stroke-width="1"/><text x="88" y="2300.5" font-size="25" font-weight="600" fill="#172D3B">GitHub</text><text x="354" y="2297.76" font-size="16" font-weight="400" fill="#172D3B">承载代码、PR 与工程检查事实。</text><text x="910" y="2297.18" font-size="13" font-weight="400" fill="#687780">当前公开体验不向真实仓库写入。</text><text x="88" y="2412.18" font-size="13" font-weight="400" fill="#687780">当前分享的是可继续编辑的副本，不是一个实时多人房间。公开样例不调用实时大模型。</text><path d="M88 2460h1264" stroke="#DDE3DE" stroke-width="1"/><text x="88" y="2544.54" font-size="39" font-weight="600" fill="#172D3B">先打开一件作品，</text><text x="88" y="2599.54" font-size="39" font-weight="600" fill="#172D3B">从一个小改动开始。</text><rect x="1000" y="2542" width="352" height="52" rx="8" fill="#176D67" stroke="#176D67"/><text x="1021" y="2572.9" font-size="15" font-weight="550" fill="#FFFFFF">直接体验，无需登录  ↗</text><text x="1100" y="2637.9" font-size="15" font-weight="550" fill="#176D67">在 GitHub 看源码  ↗</text><path d="M88 2724h1264" stroke="#DDE3DE" stroke-width="1"/><rect x="88" y="2750" width="30" height="30" rx="8" fill="#176D67" stroke="#176D67"/><path d="M95 2761h9m-4 7h9" stroke="white" stroke-width="2.7" stroke-linecap="round"/><text x="130" y="2771.78" font-size="23" font-weight="650" fill="#172D3B">TeamLink</text><text x="1068" y="2771.18" font-size="13" font-weight="400" fill="#687780">开源 · 可继续编辑 · 本地计算</text></svg>