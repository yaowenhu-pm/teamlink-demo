stroke="#FFFFFF"/><text x="731" y="393.18" font-size="13" font-weight="550" fill="#176D67">眼前条件</text><text x="876" y="393.18" font-size="13" font-weight="400" fill="#687780">首次条件</text><path d="M709 428h283" stroke="#E0E5E1" stroke-width="1"/><text x="709" y="464.04" font-size="14" font-weight="400" fill="#172D3B">等待</text><text x="760" y="461.5" font-size="25" font-weight="650" fill="#176D67">800</text><path d="M758 476h58" stroke="#176D67" stroke-width="1"/><text x="830" y="463.18" font-size="13" font-weight="400" fill="#172D3B">毫秒后超时</text><text x="938" y="463.46" font-size="11" font-weight="400" fill="#687780">↔ 拖动</text><text x="709" y="520.32" font-size="12" font-weight="400" fill="#687780">耗时假设与期望  ▸</text><text x="44" y="604.62" font-size="17" font-weight="600" fill="#172D3B">这版作品的因果摘要</text><text x="807" y="603.46" font-size="11" font-weight="400" fill="#687780">实时演算 · 不是后台执行记录</text><rect x="44" y="625" width="232" height="88" rx="10" fill="#FFFFFF" stroke="#E0E5E1"/><text x="59" y="649.32" font-size="12" font-weight="400" fill="#687780">首次选择</text><text x="59" y="681.9" font-size="15" font-weight="550" fill="#172D3B">10 月 / 产品 · 3 条</text><rect x="290" y="625" width="232" height="88" rx="10" fill="#FBF4E8" stroke="#FBF4E8"/><text x="305" y="649.32" font-size="12" font-weight="400" fill="#687780">超时以后</text><text x="305" y="681.9" font-size="15" font-weight="550" fill="#91662A">800 ms · 条件清空</text><rect x="536" y="625" width="232" height="88" rx="10" fill="#FFFFFF" stroke="#E0E5E1"/><text x="551" y="649.32" font-size="12" font-weight="400" fill="#687780">再次请求</text><text x="551" y="681.9" font-size="15" font-weight="550" fill="#172D3B">全部 / 全部 · 10 条</text><rect x="782" y="625" width="232" height="88" rx="10" fill="#FBF4E8" stroke="#FBF4E8"/><text x="797" y="649.32" font-size="12" font-weight="400" fill="#687780">文件结果</text><text x="797" y="681.9" font-size="15" font-weight="550" fill="#91662A">10 条 · 多出 7 条</text><rect x="44" y="738" width="970" height="225" rx="14" fill="#FFFFFF" stroke="#E0E5E1"/><text x="68" y="773.48" font-size="18" font-weight="600" fill="#172D3B">当前规则会得到的文件</text><rect x="834" y="750" width="156" height="36" rx="8" fill="#FFFFFF" stroke="#E0E5E1"/><text x="847" y="772.18" font-size="13" font-weight="550" fill="#172D3B">下载推演 CSV  ↓</text><text x="68" y="800.32" font-size="12" font-weight="400" fill="#687780">文件与最初选择不同。下面直接展示原本选中和额外导出的记录。</text><rect x="68" y="819" width="922" height="28" rx="6" fill="#F2F4F1" stroke="#F2F4F1"/><text x="82" y="837.32" font-size="12" font-weight="550" fill="#687780">日期</text><text x="242" y="837.32" font-size="12" font-weight="550" fill="#687780">分类</text><text x="358" y="837.32" font-size="12" font-weight="550" fill="#687780">实际文件内容</text><text x="826" y="837.32" font-size="12" font-weight="550" fill="#687780">与首次选择对比</text><text x="82" y="867.32" font-size="12" font-weight="400" fill="#172D3B">2026-10-03</text><text x="242" y="867.32" font-size="12" font-weight="400" fill="#172D3B">产品</text><text x="358" y="867.32" font-size="12" font-weight="400" fill="#172D3B">活动报名流程梳理</text><text x="826" y="867.32" font-size="12" font-weight="400" fill="#172D3B">原本选中</text><text x="82" y="894.32" font-size="12" font-weight="400" fill="#172D3B">2026-10-12</text><text x="242" y="894.32" font-size="12" font-weight="400" fill="#172D3B">产品</text><text x="358" y="894.32" font-size="12" font-weight="400" fill="#172D3B">导出失败反馈整理</text><text x="826" y="894.32" font-size="12" font-weight="400" fill="#172D3B">原本选中</text><rect x="68" y="907" width="922" height="27" rx="0" fill="#FBF4E8" stroke="#FBF4E8"/><text x="82" y="921.32" font-size="12" font-weight="400" fill="#91662A">2026-09-18</text><text x="242" y="921.32" font-size="12" font-weight="400" fill="#91662A">研发</text><text x="358" y="921.32" font-size="12" font-weight="400" fill="#91662A">上月数据接口整理</text><text x="826" y="921.32" font-size="12" font-weight="400" fill="#91662A">额外导出</text><text x="68" y="952.46" font-size="11" font-weight="400" fill="#687780">预览 3 / 10 条；完整文件来自同一份数据。</text><rect x="1038" y="97" width="358" height="866" rx="14" fill="#FFFFFF" stroke="#E0E5E1"/><text x="1060" y="136.34" font-size="19" font-weight="600" fill="#172D3B">导出体验共创</text><text x="1060" y="165.46" font-size="11" font-weight="400" fill="#687780">目标</text><text x="1060" y="190.9" font-size="15" font-weight="450" fill="#172D3B">失败后不丢条件，拿到真正</text><text x="1060" y="215.9" font-size="15" font-weight="450" fill="#172D3B">选中的数据。</text><text x="1060" y="250.46" font-size="11" font-weight="400" fill="#687780">本地项目 · 分享会打开独立副本</text><path d="M1060 273h314" stroke="#E0E5E1" stroke-width="1"/><text x="1060" y="303.18" font-size="13" font-weight="400" fill="#687780">方案</text><text x="1145" y="303.18" font-size="13" font-weight="400" fill="#687780">批注</text><text x="1232" y="303.18" font-size="13" font-weight="600" fill="#176D67">Agent 交接</text><path d="M1229 320h125" stroke="#176D67" stroke-width="2"/><text x="1060" y="357.76" font-size="16" font-weight="600" fill="#172D3B">把这次发现交给自己的 Codex</text><rect x="1060" y="380" width="314" height="67" rx="9" fill="#EAF3EF" stroke="#EAF3EF"/><text x="1074" y="404.18" font-size="13" font-weight="550" fill="#176D67">关注：超时后筛选条件被清空</text><text x="1074" y="431.32" font-size="12" font-weight="400" fill="#687780">任务基于当前作品与选中的规则。</text><text x="1060" y="478.32" font-size="12" font-weight="400" fill="#687780">带上这版作品、规则、数据和案例。</text><text x="1060" y="501.32" font-size="12" font-weight="400" fill="#687780">只导出任务包，不会在网页启动 Agent。</text><rect x="1060" y="531" width="314" height="36" rx="8" fill="#176D67" stroke="#176D67"/><text x="1073" y="553.18" font-size="13" font-weight="550" fill="#FFFFFF">导出 Agent 任务包  ↓</text><text x="1060" y="600.18" font-size="13" font-weight="450" fill="#172D3B">在自己的 Codex 中处理，</text><text x="1060" y="625.18" font-size="13" font-weight="450" fill="#172D3B">把返回的方案文件带回来。</text><rect x="1060" y="654" width="314" height="36" rx="8" fill="#FFFFFF" stroke="#E0E5E1"/><text x="1073" y="676.18" font-size="13" font-weight="550" fill="#172D3B">导入 Codex 返回方案  ↑</text><path d="M1060 720h314" stroke="#E0E5E1" stroke-width="1"/><text x="1060" y="754.04" font-size="14" font-weight="550" fill="#687780">尚未导入返回方案</text><text x="1060" y="784.32" font-size="12" font-weight="400" fill="#687780">导入后先看字段差异与效果变化，</text><text x="1060" y="808.32" font-size="12" font-weight="400" fill="#687780">再决定是否采纳为新的方案。</text><text x="1060" y="855.32" font-size="12" font-weight="550" fill="#176D67">版本已变化？先比较，不直接覆盖。</text><text x="1060" y="898.46" font-size="11" font-weight="400" fill="#687780">这是异步文件交接。没有实时多人</text><text x="1060" y="920.46" font-size="11" font-weight="400" fill="#687780">同步、虚构成员在线或后台 Agent 执行。</text><text x="44" y="994.6" font-size="10" font-weight="400" fill="#687780">虚构样例 · 作品与方案保存在本浏览器。分享副本不代表同一个在线房间。</text></svg>